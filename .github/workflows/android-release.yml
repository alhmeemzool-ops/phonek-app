name: PhoneK Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - update.json
      - '**.md'
      - 'supabase/**'

permissions:
  contents: write

concurrency:
  group: phonek-android-release
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Check release signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS"; exit 1; }

      - name: Restore Android upload keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode --ignore-garbage > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          chmod 600 android/upload-keystore.jks android/key.properties
          actual_sha256=$(sha256sum android/upload-keystore.jks | awk '{print $1}')
          actual_size=$(stat -c '%s' android/upload-keystore.jks)
          echo "keystore_size=$actual_size"
          echo "keystore_sha256=$actual_sha256"
          if [ "$actual_sha256" != "513d33a0148936e68fab5bec062f48fbb350d83182451fdf2443eddda31a3f60" ]; then
            echo "Keystore bytes do not match the uploaded keystore file."
            exit 1
          fi
          if ! keytool -list -keystore android/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "Keystore bytes match, but password or alias is incorrect."
            exit 1
          fi
          echo "Keystore bytes and signing credentials verified."

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Flutter test
        run: flutter test

      - name: Read app version
        id: version
        shell: bash
        run: |
          version_line=$(grep '^version:' pubspec.yaml)
          version_name=$(echo "$version_line" | sed -E 's/version: ([^+]+)\+.*/\1/')
          version_code=$(echo "$version_line" | sed -E 's/version: [^+]+\+([0-9]+)/\1/')
          test -n "$version_name" && test -n "$version_code"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Guard existing release tag
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::warning::Release $tag already exists; bump version in pubspec.yaml."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if release tag already exists
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump version in pubspec.yaml instead of reusing an existing release."
            exit 1
          fi

      - name: Read previous manifest
        if: steps.guard.outputs.skip != 'true'
        id: previous
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          try: d=json.load(open("update.json"))
          except Exception: d={}
          print("version_code="+str(d.get("versionCode","")))
          print("apk_url="+str(d.get("apkUrl","")))
          print("sha256="+str(d.get("sha256","")))
          PY

      - name: Build release APK (ARM32 + ARM64)
        if: steps.guard.outputs.skip != 'true'
        run: flutter build apk --release --target-platform android-arm,android-arm64 --build-name=${{ steps.version.outputs.version_name }} --build-number=${{ steps.version.outputs.version_code }}

      - name: Verify APK versionCode
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          apk="build/app/outputs/flutter-apk/app-release.apk"
          aapt2_bin=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          test -x "$aapt2_bin" || { echo "aapt2 not found"; exit 1; }
          apk_code=$("$aapt2_bin" dump badging "$apk" | sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p" | head -n 1)
          test -n "$apk_code" || { echo "Could not read APK versionCode"; exit 1; }
          test "$apk_code" = "${{ steps.version.outputs.version_code }}" || {
            echo "APK versionCode does not match pubspec versionCode."
            exit 1
          }
          echo "APK versionCode verified: $apk_code"

      - name: Calculate APK SHA-256
        if: steps.guard.outputs.skip != 'true'
        id: checksum
        shell: bash
        run: echo "sha256=$(sha256sum build/app/outputs/flutter-apk/app-release.apk | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Build and validate incremental patch
        if: steps.guard.outputs.skip != 'true'
        id: patch
        shell: bash
        run: |
          echo "ok=false" >> "$GITHUB_OUTPUT"
          base_code="${{ steps.previous.outputs.version_code }}"
          old_url="${{ steps.previous.outputs.apk_url }}"
          new_code="${{ steps.version.outputs.version_code }}"
          new_apk="build/app/outputs/flutter-apk/app-release.apk"

          if [ -z "$base_code" ] || [ -z "$old_url" ] || [ "$base_code" = "$new_code" ]; then
            echo "No compatible previous release was found; full APK fallback will be used."
            exit 0
          fi

          curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o old-release.apk "$old_url" || exit 0

          old_sha="${{ steps.previous.outputs.sha256 }}"
          if [ -n "$old_sha" ] && [ "$(sha256sum old-release.apk | awk '{print $1}')" != "$old_sha" ]; then
            echo "Previous APK checksum mismatch; patch disabled."
            exit 0
          fi

          timeout 900 dart run tool/build_patch.dart old-release.apk "$new_apk" patch.bin || {
            echo "Patch generation timed out or failed; full APK fallback will be used."
            exit 0
          }
          [ -s patch.bin ] || exit 0

          timeout 900 dart run tool/validate_patch.dart old-release.apk patch.bin reconstructed.apk || {
            echo "Patch validation timed out or failed; full APK fallback will be used."
            rm -f patch.bin reconstructed.apk
            exit 0
          }

          new_sha="$(sha256sum "$new_apk" | awk '{print $1}')"
          reconstructed_sha="$(sha256sum reconstructed.apk | awk '{print $1}')"
          if [ "$new_sha" != "$reconstructed_sha" ]; then
            echo "Patch validation failed: reconstructed APK SHA-256 differs."
            rm -f patch.bin reconstructed.apk
            exit 0
          fi

          patch_size=$(stat -c '%s' patch.bin)
          apk_size=$(stat -c '%s' "$new_apk")
          echo "new_apk_size=$apk_size"
          echo "patch_size=$patch_size"

          if [ "$patch_size" -ge "$apk_size" ]; then
            echo "Patch is not smaller than the APK; full APK fallback will be used."
            rm -f patch.bin reconstructed.apk
            exit 0
          fi

          echo "Patch validated successfully: SHA-256 matches the new APK."
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum patch.bin | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "base_version_code=$base_code" >> "$GITHUB_OUTPUT"

      - name: Publish PhoneK APK release
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version_name }}"
          assets="build/app/outputs/flutter-apk/app-release.apk"
          if [ "${{ steps.patch.outputs.ok }}" = "true" ]; then assets="$assets patch.bin"; fi
          gh release create "$tag" $assets \
            --title "PhoneK ${{ steps.version.outputs.version_name }}" \
            --notes "تحديث PhoneK رقم ${{ steps.version.outputs.version_code }} - ARM32 + ARM64"

      - name: Verify published release assets
        if: steps.guard.outputs.skip != 'true'
        id: published
        shell: bash
        env:
          APK_URL: https://github.com/alhmeemzool-ops/phonek-app/releases/download/v${{ steps.version.outputs.version_name }}/app-release.apk
          PATCH_URL: https://github.com/alhmeemzool-ops/phonek-app/releases/download/v${{ steps.version.outputs.version_name }}/patch.bin
          BUILT_APK_SHA256: ${{ steps.checksum.outputs.sha256 }}
          BUILT_PATCH_SHA256: ${{ steps.patch.outputs.sha256 }}
          PATCH_OK: ${{ steps.patch.outputs.ok }}
        run: |
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o published-app-release.apk "$APK_URL"
          published_apk_sha256=$(sha256sum published-app-release.apk | awk '{print $1}')
          if [ "$published_apk_sha256" != "$BUILT_APK_SHA256" ]; then
            echo "Published APK checksum does not match the built APK."
            exit 1
          fi
          echo "apk_sha256=$published_apk_sha256" >> "$GITHUB_OUTPUT"

          if [ "$PATCH_OK" = "true" ]; then
            curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o published-patch.bin "$PATCH_URL"
            published_patch_sha256=$(sha256sum published-patch.bin | awk '{print $1}')
            if [ "$published_patch_sha256" != "$BUILT_PATCH_SHA256" ]; then
              echo "Published patch checksum does not match the built patch."
              exit 1
            fi
            echo "patch_sha256=$published_patch_sha256" >> "$GITHUB_OUTPUT"
          fi

      - name: Update PhoneK update manifest
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          APK_SHA256: ${{ steps.published.outputs.apk_sha256 }}
          PATCH_OK: ${{ steps.patch.outputs.ok }}
          PATCH_SHA256: ${{ steps.published.outputs.patch_sha256 }}
          PATCH_BASE: ${{ steps.patch.outputs.base_version_code }}
        run: |
          python3 - <<PY
          import json
          ok="${{ steps.patch.outputs.ok }}"=="true"
          d={
            "versionCode":int("${{ steps.version.outputs.version_code }}"),
            "versionName":"${{ steps.version.outputs.version_name }}",
            "apkUrl":"https://github.com/alhmeemzool-ops/phonek-app/releases/download/v${{ steps.version.outputs.version_name }}/app-release.apk",
            "sha256":"$APK_SHA256",
            "patchUrl":"https://github.com/alhmeemzool-ops/phonek-app/releases/download/v${{ steps.version.outputs.version_name }}/patch.bin" if ok else None,
            "patchSha256":"$PATCH_SHA256" if ok else None,
            "patchBaseVersionCode":int("$PATCH_BASE") if ok else None,
            "minSupportedVersionCode":58,
            "mandatory":False,
            "notes":"تحديث جديد لتحسين PhoneK وإصلاح الأخطاء."
          }
          with open("update.json","w",encoding="utf-8") as f:
              json.dump(d,f,ensure_ascii=False,indent=2); f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --cached --quiet; then
            echo "update.json unchanged"
            exit 0
          fi
          git commit -m "Update PhoneK update manifest"

          # اكشف سبب التعديلات ثم احذف مخلفات البناء (مثل pubspec.lock)؛ الـ commit محفوظ
          git status --short
          git reset --hard HEAD

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Failed to push update manifest after 3 attempts."
          exit 1

      - name: Upload APK artifact
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phonek-apk-${{ steps.version.outputs.version_name }}-arm
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
