name: PhoneK Android Release

on:
  # Full Release يدوي فقط؛ كل push يمر عبر Quick APK.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phonek-android-release
  cancel-in-progress: false

jobs:
  build-android:
    if: github.event.head_commit.message != 'Update PhoneK update manifest'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Check release signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS"; exit 1; }

      - name: Restore Android upload keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode --ignore-garbage > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          chmod 600 android/upload-keystore.jks android/key.properties
          actual_sha256=$(sha256sum android/upload-keystore.jks | awk '{print $1}')
          actual_size=$(stat -c '%s' android/upload-keystore.jks)
          echo "keystore_size=$actual_size"
          echo "keystore_sha256=$actual_sha256"
          if [ "$actual_sha256" != "513d33a0148936e68fab5bec062f48fbb350d83182451fdf2443eddda31a3f60" ]; then
            echo "Keystore bytes do not match the uploaded keystore file."
            exit 1
          fi
          if ! keytool -list -keystore android/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "Keystore bytes match, but password or alias is incorrect."
            exit 1
          fi
          echo "Keystore bytes and signing credentials verified."

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Flutter test
        run: flutter test

      - name: Python patch unit tests
        run: python3 -m unittest tool/test_make_patches.py

      - name: Read app version
        id: version
        shell: bash
        run: |
          version_line=$(grep '^version:' pubspec.yaml)
          version_name=$(echo "$version_line" | sed -E 's/version: ([^+]+)\+.*/\1/')
          version_code=$(echo "$version_line" | sed -E 's/version: [^+]+\+([0-9]+)/\1/')
          test -n "$version_name" && test -n "$version_code"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Guard existing release tag
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists, so NO update would be published. Bump the version in pubspec.yaml (for example 1.0.68+68). If the release was created but update.json was not updated, delete that release and its tag, then run this workflow again."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Fail if release tag already exists
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump version in pubspec.yaml instead of reusing an existing release."
            exit 1
          fi

      - name: Fetch latest update manifest
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:update.json > latest-update.json

      - name: Build release APK (ARM32 + ARM64)
        if: steps.guard.outputs.skip != 'true'
        run: flutter build apk --release --target-platform android-arm,android-arm64 --build-name=${{ steps.version.outputs.version_name }} --build-number=${{ steps.version.outputs.version_code }}

      - name: Verify APK versionCode
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          apk="build/app/outputs/flutter-apk/app-release.apk"
          aapt2_bin=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          test -x "$aapt2_bin" || { echo "aapt2 not found"; exit 1; }
          apk_code=$("$aapt2_bin" dump badging "$apk" | sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p" | head -n 1)
          test -n "$apk_code" || { echo "Could not read APK versionCode"; exit 1; }
          test "$apk_code" = "${{ steps.version.outputs.version_code }}" || {
            echo "APK versionCode does not match pubspec versionCode."
            exit 1
          }
          echo "APK versionCode verified: $apk_code"

      - name: Verify APK signature
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          apk="build/app/outputs/flutter-apk/app-release.apk"
          apksigner_bin=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -x "$apksigner_bin" || { echo "apksigner not found"; exit 1; }
          "$apksigner_bin" verify --print-certs "$apk"
          echo "APK signature verified."

      - name: Calculate APK SHA-256
        if: steps.guard.outputs.skip != 'true'
        id: checksum
        shell: bash
        run: echo "sha256=$(sha256sum build/app/outputs/flutter-apk/app-release.apk | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Build incremental patches
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 25
        env:
          PHONEK_MAX_PATCH_BASES: 2
        run: |
          python3 tool/make_patches.py build             --manifest latest-update.json             --new-apk build/app/outputs/flutter-apk/app-release.apk             --new-version-code "${{ steps.version.outputs.version_code }}"             --output patch-results.json

      - name: Publish PhoneK APK release
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version_name }}"
          mapfile -t patch_files < <(python3 - <<'PY'
          import json
          d=json.load(open("patch-results.json"))
          for p in d.get("patches", []):
              print(p["file"])
          PY
          )
          assets=(build/app/outputs/flutter-apk/app-release.apk)
          if [ "${#patch_files[@]}" -gt 0 ]; then
            assets+=( "${patch_files[@]}" )
          fi
          gh release create "$tag" "${assets[@]}"             --title "PhoneK ${{ steps.version.outputs.version_name }}"             --notes "تحديث PhoneK رقم ${{ steps.version.outputs.version_code }} - ARM32 + ARM64"

      - name: Verify published release assets
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          BUILT_APK_SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          tag="v${VERSION_NAME}"
          apk_url="https://github.com/alhmeemzool-ops/phonek-app/releases/download/${tag}/app-release.apk"
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o published-app-release.apk "$apk_url"
          published_apk_sha256=$(sha256sum published-app-release.apk | awk '{print $1}')
          test "$published_apk_sha256" = "$BUILT_APK_SHA256" || {
            echo "Published APK checksum does not match the built APK."
            exit 1
          }
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          path=Path("patch-results.json")
          data=json.loads(path.read_text())
          kept=[]
          tag="v"+os.environ["VERSION_NAME"]
          for patch in data.get("patches", []):
              base=int(patch["baseVersionCode"])
              filename=f"patch-from-{base}.bin"
              url=f"https://github.com/alhmeemzool-ops/phonek-app/releases/download/{tag}/{filename}"
              try:
                  out=Path(f"published-patch-{base}.bin")
                  subprocess.run(["curl","-fL","--retry","5","--retry-delay","3","--retry-all-errors","-o",str(out),url],check=True)
                  digest=hashlib.sha256(out.read_bytes()).hexdigest()
                  if digest == patch["sha256"]:
                      kept.append(patch)
                  else:
                      print(f"Dropping {filename}: published SHA-256 mismatch")
                      subprocess.run(["gh","release","delete-asset",tag,filename,"--yes"],check=False)
                  out.unlink(missing_ok=True)
              except Exception as exc:
                  print(f"Dropping {filename}: verification failed: {exc}")
                  subprocess.run(["gh","release","delete-asset",tag,filename,"--yes"],check=False)
          data["patches"]=kept
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n")
          PY

      - name: Write PhoneK update manifest
        if: steps.guard.outputs.skip != 'true'
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK_SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          python3 tool/make_patches.py manifest             --manifest latest-update.json             --result patch-results.json             --new-apk build/app/outputs/flutter-apk/app-release.apk             --version-code "$VERSION_CODE"             --version-name "$VERSION_NAME"             --apk-url "https://github.com/alhmeemzool-ops/phonek-app/releases/download/v${VERSION_NAME}/app-release.apk"             --apk-sha256 "$APK_SHA256"             --release-prefix "https://github.com/alhmeemzool-ops/phonek-app/releases/download/v${VERSION_NAME}/"             --output update.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --cached --quiet; then
            echo "update.json unchanged"
            exit 0
          fi
          git commit -m "Update PhoneK update manifest"

          # اكشف سبب التعديلات ثم احذف مخلفات البناء (مثل pubspec.lock)؛ الـ commit محفوظ
          git status --short
          git reset --hard HEAD

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Failed to push update manifest after 3 attempts."
          exit 1

      - name: Upload APK artifact
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phonek-apk-${{ steps.version.outputs.version_name }}-arm
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
