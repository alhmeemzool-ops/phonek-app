name: PhoneK Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - update.json

permissions:
  contents: write

concurrency:
  group: phonek-android-release
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Check release signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS"; exit 1; }

      - name: Restore Android upload keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode --ignore-garbage > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          chmod 600 android/upload-keystore.jks android/key.properties
          actual_sha256=$(sha256sum android/upload-keystore.jks | awk '{print $1}')
          actual_size=$(stat -c '%s' android/upload-keystore.jks)
          echo "keystore_size=$actual_size"
          echo "keystore_sha256=$actual_sha256"
          if [ "$actual_sha256" != "513d33a0148936e68fab5bec062f48fbb350d83182451fdf2443eddda31a3f60" ]; then
            echo "Keystore bytes do not match the uploaded keystore file."
            exit 1
          fi
          if ! keytool -list -keystore android/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "Keystore bytes match, but password or alias is incorrect."
            exit 1
          fi
          echo "Keystore bytes and signing credentials verified."

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version
        id: version
        shell: bash
        run: |
          version_line=$(grep '^version:' pubspec.yaml)
          version_name=$(echo "$version_line" | sed -E 's/version: ([^+]+)\+.*/\1/')
          version_code=$(echo "$version_line" | sed -E 's/version: [^+]+\+([0-9]+)/\1/')
          test -n "$version_name" && test -n "$version_code"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Read previous manifest
        id: previous
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          try: d=json.load(open("update.json"))
          except Exception: d={}
          print("version_code="+str(d.get("versionCode","")))
          print("apk_url="+str(d.get("apkUrl","")))
          print("sha256="+str(d.get("sha256","")))
          PY

      - name: Build release APK
        run: flutter build apk --release --build-name=${{ steps.version.outputs.version_name }} --build-number=${{ steps.version.outputs.version_code }}

      - name: Calculate APK SHA-256
        id: checksum
        shell: bash
        run: echo "sha256=$(sha256sum build/app/outputs/flutter-apk/app-release.apk | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Build and validate incremental patch
        id: patch
        shell: bash
        run: |
          echo "ok=false" >> "$GITHUB_OUTPUT"
          base_code="${{ steps.previous.outputs.version_code }}"
          old_url="${{ steps.previous.outputs.apk_url }}"
          new_code="${{ steps.version.outputs.version_code }}"
          new_apk="build/app/outputs/flutter-apk/app-release.apk"

          if [ -z "$base_code" ] || [ -z "$old_url" ] || [ "$base_code" = "$new_code" ]; then
            echo "No compatible previous release was found; full APK fallback will be used."
            exit 0
          fi

          curl -fL --retry 3 -o old-release.apk "$old_url" || exit 0

          old_sha="${{ steps.previous.outputs.sha256 }}"
          if [ -n "$old_sha" ] && [ "$(sha256sum old-release.apk | awk '{print $1}')" != "$old_sha" ]; then
            echo "Previous APK checksum mismatch; patch disabled."
            exit 0
          fi

          timeout 900 dart run tool/build_patch.dart old-release.apk "$new_apk" patch.bin || {
            echo "Patch generation timed out or failed; full APK fallback will be used."
            exit 0
          }
          [ -s patch.bin ] || exit 0

          # A patch is only publishable if applying it reconstructs the new APK byte-for-byte.
          timeout 900 dart run tool/validate_patch.dart old-release.apk patch.bin reconstructed.apk || {
            echo "Patch validation timed out or failed; full APK fallback will be used."
            rm -f patch.bin reconstructed.apk
            exit 0
          }

          new_sha="$(sha256sum "$new_apk" | awk '{print $1}')"
          reconstructed_sha="$(sha256sum reconstructed.apk | awk '{print $1}')"
          if [ "$new_sha" != "$reconstructed_sha" ]; then
            echo "Patch validation failed: reconstructed APK SHA-256 differs."
            rm -f patch.bin reconstructed.apk
            exit 0
          fi

          patch_size=$(stat -c '%s' patch.bin)
          apk_size=$(stat -c '%s' "$new_apk")
          echo "new_apk_size=$apk_size"
          echo "patch_size=$patch_size"

          # Never ship a patch larger than the APK it replaces.
          if [ "$patch_size" -ge "$apk_size" ]; then
            echo "Patch is not smaller than the APK; full APK fallback will be used."
            rm -f patch.bin reconstructed.apk
            exit 0
          fi

          echo "Patch validated successfully: SHA-256 matches the new APK."
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum patch.bin | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "base_version_code=$base_code" >> "$GITHUB_OUTPUT"

      - name: Publish PhoneK APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; reusing it."
          else
            assets="build/app/outputs/flutter-apk/app-release.apk"
            if [ "${{ steps.patch.outputs.ok }}" = "true" ]; then assets="$assets patch.bin"; fi
            gh release create "$tag" $assets               --title "PhoneK ${{ steps.version.outputs.version_name }}"               --notes "تحديث PhoneK رقم ${{ steps.version.outputs.version_code }}"
          fi

      - name: Update PhoneK update manifest
        shell: bash
        env:
          APK_SHA256: ${{ steps.checksum.outputs.sha256 }}
          PATCH_OK: ${{ steps.patch.outputs.ok }}
          PATCH_SHA256: ${{ steps.patch.outputs.sha256 }}
          PATCH_BASE: ${{ steps.patch.outputs.base_version_code }}
        run: |
          python3 - <<PY
          import json
          ok="${{ steps.patch.outputs.ok }}"=="true"
          d={
            "versionCode":int("${{ steps.version.outputs.version_code }}"),
            "versionName":"${{ steps.version.outputs.version_name }}",
            "apkUrl":"https://github.com/alhmeemzool-ops/phonek-app/releases/download/v${{ steps.version.outputs.version_name }}/app-release.apk",
            "sha256":"$APK_SHA256",
            "patchUrl":"https://github.com/alhmeemzool-ops/phonek-app/releases/download/v${{ steps.version.outputs.version_name }}/patch.bin" if ok else None,
            "patchSha256":"$PATCH_SHA256" if ok else None,
            "patchBaseVersionCode":int("$PATCH_BASE") if ok else None,
            "mandatory":False,
            "notes":"تحديث جديد لتحسين PhoneK وإصلاح الأخطاء."
          }
          with open("update.json","w",encoding="utf-8") as f:
              json.dump(d,f,ensure_ascii=False,indent=2); f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if ! git diff --cached --quiet; then git commit -m "Update PhoneK update manifest"; git push origin HEAD:main; fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phonek-apk-${{ steps.version.outputs.version_name }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
