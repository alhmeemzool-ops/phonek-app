name: PhoneK Android Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-release.yml'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check release signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS"; exit 1; }

      - name: Restore Android upload keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Normalize copied secret values (line breaks/Markdown whitespace) before decoding.
          # --ignore-garbage tolerates harmless formatting characters without exposing the secret.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode --ignore-garbage > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          chmod 600 android/upload-keystore.jks android/key.properties
          keytool -list -keystore android/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Install dependencies
        run: flutter pub get

      - name: Build release AAB
        run: flutter build appbundle --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Build release APK
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=PHONEK_BUILD_NUMBER=${{ github.run_number }}

      - name: Calculate APK SHA-256
        id: checksum
        shell: bash
        run: echo "sha256=$(sha256sum build/app/outputs/flutter-apk/app-release.apk | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Publish PhoneK APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            build/app/outputs/flutter-apk/app-release.apk#phonek.apk \
            --title "PhoneK 1.0.${{ github.run_number }}" \
            --notes "تحديث PhoneK رقم ${{ github.run_number }}"

      - name: Update PhoneK update manifest
        shell: bash
        env:
          APK_SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          cat > update.json <<EOF
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.${{ github.run_number }}",
            "apkUrl": "https://github.com/alhmeemzool-ops/phonek-app/releases/download/v1.0.${{ github.run_number }}/phonek.apk",
            "sha256": "$APK_SHA256",
            "mandatory": false,
            "notes": "تحديث جديد لتحسين PhoneK وإصلاح الأخطاء."
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Update PhoneK update manifest to 1.0.${{ github.run_number }}"
          git push

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: phonek-aab-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phonek-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
