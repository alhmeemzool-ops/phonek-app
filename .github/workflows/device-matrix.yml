name: PhoneK Three-Device Test Matrix

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/device-matrix.yml'

permissions:
  contents: read

concurrency:
  group: phonek-device-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-unit-tests:
    name: Flutter tests (API-independent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Run all Flutter tests
        run: flutter test --no-pub

  emulator-smoke:
    name: Android emulator smoke (${{ matrix.device }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: Pixel 2 API 30
            api: 30
            profile: pixel_2
          - device: Pixel 6 API 34
            api: 34
            profile: pixel_6
          - device: Pixel 8 API 35
            api: 35
            profile: pixel_8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Build release APK for ARM/ARM64
        run: flutter build apk --release --target-platform android-arm,android-arm64 --no-pub
      - name: Run Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          profile: ${{ matrix.profile }}
          arch: x86_64
          disable-animations: true
          script: |
            set -Eeuo pipefail
            APK=build/app/outputs/flutter-apk/app-release.apk
            adb wait-for-device
            adb shell getprop ro.build.version.release
            adb shell getprop ro.build.version.sdk
            adb install -r "$APK"
            adb shell am force-stop com.phonek.phonek_app
            adb shell monkey -p com.phonek.phonek_app 1
            sleep 35
            if adb shell pidof com.phonek.phonek_app >/dev/null 2>&1; then
              echo "PASS: PhoneK process stayed alive after launch on API ${{ matrix.api }}"
            else
              echo "FAIL: PhoneK process was not running after launch on API ${{ matrix.api }}"
              adb logcat -d -s AndroidRuntime:E Flutter:E flutter:V
              exit 1
            fi
            adb shell screencap -p /sdcard/phonek-smoke.png
            adb pull /sdcard/phonek-smoke.png phonek-smoke-${{ matrix.api }}.png
            adb logcat -d -s AndroidRuntime:E Flutter:E flutter:V > phonek-logcat-${{ matrix.api }}.txt
            if grep -E 'FATAL EXCEPTION|Unhandled Exception|E/flutter' phonek-logcat-${{ matrix.api }}.txt; then
              echo "Review runtime error log for API ${{ matrix.api }}"
              exit 1
            fi
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phonek-emulator-evidence-api-${{ matrix.api }}
          path: |
            phonek-smoke-${{ matrix.api }}.png
            phonek-logcat-${{ matrix.api }}.txt
          if-no-files-found: ignore
          retention-days: 14
