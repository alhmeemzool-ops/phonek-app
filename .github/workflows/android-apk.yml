name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/google-auth-shop-accounts

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Patch share_plus Android compile SDK
        run: |
          for file in "$PUB_CACHE"/hosted/pub.dev/share_plus-*/android/build.gradle; do
            if [ -f "$file" ]; then
              sed -i 's/compileSdkVersion 33/compileSdkVersion 36/g' "$file"
            fi
          done

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phonek-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
