name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Patch share_plus Android compile SDK
        run: |
          for file in "$PUB_CACHE"/hosted/pub.dev/share_plus-*/android/build.gradle; do
            if [ -f "$file" ]; then
              sed -i 's/compileSdkVersion 33/compileSdkVersion 36/g' "$file"
            fi
          done

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phonek-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
