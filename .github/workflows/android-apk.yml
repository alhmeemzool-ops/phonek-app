name: Quick Android APK
# CI trigger: build current versioned APK on main

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phonek-quick-apk
  cancel-in-progress: true

jobs:
  build-apk:
    if: github.event.head_commit.message != 'Update PhoneK quick update manifest' && github.event.head_commit.message != 'Update PhoneK update manifest'
    runs-on: ubuntu-latest
    env:
      SKIP_PATCHES: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Dependency cache: stable and independent from the rolling build cache.
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-*
            ~/.gradle/caches/transforms-*
            ~/.gradle/wrapper
          key: phonek-gradle-deps-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/settings.gradle.kts', 'android/build.gradle*', 'android/app/build.gradle*') }}
          restore-keys: |
            phonek-gradle-deps-${{ runner.os }}-

      # Rolling build cache: every Quick run saves new Gradle task outputs,
      # while the next run restores the newest previous cache.
      - name: Cache Gradle build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/build-cache-1
            android/.gradle
          key: phonek-quick-build-${{ runner.os }}-flutter-3.47.2-${{ github.sha }}
          restore-keys: |
            phonek-quick-build-${{ runner.os }}-flutter-3.47.2-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Cache Flutter/Dart packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: phonek-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            phonek-pub-${{ runner.os }}-


      - name: Restore Android upload keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode --ignore-garbage > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          chmod 600 android/upload-keystore.jks android/key.properties
          keytool -list -keystore android/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Install dependencies
        run: flutter pub get

      - name: Patch share_plus Android compile SDK
        run: |
          for file in "$PUB_CACHE"/hosted/pub.dev/share_plus-*/android/build.gradle; do
            if [ -f "$file" ]; then
              sed -i 's/compileSdkVersion 33/compileSdkVersion 36/g' "$file"
            fi
          done

      - name: Read app version
        id: version
        shell: bash
        run: |
          version_line=$(grep '^version:' pubspec.yaml)
          version_name=$(echo "$version_line" | sed -E 's/version: ([^+]+)\+.*/\1/')
          version_code=$(echo "$version_line" | sed -E 's/version: [^+]+\+([0-9]+)/\1/')
          test -n "$version_name" && test -n "$version_code"
          case "$version_code" in
            ''|*[!0-9]*) echo "Invalid versionCode: $version_code"; exit 1 ;;
          esac
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Quick APK version: $version_name+$version_code"

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm,android-arm64 --no-pub --build-name=${{ steps.version.outputs.version_name }} --build-number=${{ steps.version.outputs.version_code }} --dart-define=PHONEK_BUILD_NUMBER=${{ steps.version.outputs.version_code }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phonek-quick-release-apk-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Fetch latest update manifest
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:update.json > latest-update.json || cp update.json latest-update.json

      - name: Run incremental update tests
        if: env.SKIP_PATCHES != 'true'
        shell: bash
        run: |
          python3 -m unittest tool/test_make_patches.py
          flutter test test/update_manifest_test.dart

      - name: Build candidate incremental patches
        if: env.SKIP_PATCHES != 'true'
        continue-on-error: true
        timeout-minutes: 25
        env:
          PHONEK_MAX_PATCH_BASES: 1
        run: |
          python3 tool/make_patches.py build --manifest latest-update.json --new-apk build/app/outputs/flutter-apk/app-release.apk --new-version-code "${{ steps.version.outputs.version_code }}" --output patch-results.json

      - name: Ensure patch result exists
        shell: bash
        run: |
          if [ ! -s patch-results.json ]; then
            printf '%s\n' '{"patches":[],"skipped":[{"baseVersionCode":null,"reason":"patch builder failed or timed out"}]}' > patch-results.json
          fi

      - name: Publish versioned Quick Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          tag="quick-v${VERSION_NAME}"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          mapfile -t patch_files < <(python3 - <<'PY'
          import json
          d=json.load(open("patch-results.json"))
          for p in d.get("patches", []):
              print(p["file"])
          PY
          )
          assets=(build/app/outputs/flutter-apk/app-release.apk)
          if [ "${#patch_files[@]}" -gt 0 ]; then
            assets+=( "${patch_files[@]}" )
          fi
          gh release create "$tag" "${assets[@]}" --title "PhoneK Quick ${VERSION_NAME}" --notes "Quick APK update ${VERSION_NAME} (${VERSION_CODE})"

      - name: Verify published release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          tag="quick-v${VERSION_NAME}"
          apk_url="https://github.com/alhmeemzool-ops/phonek-app/releases/download/${tag}/app-release.apk"
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o published-app-release.apk "$apk_url"
          built_apk_sha256="$(sha256sum build/app/outputs/flutter-apk/app-release.apk | awk '{print $1}')"
          published_apk_sha256="$(sha256sum published-app-release.apk | awk '{print $1}')"
          test "$published_apk_sha256" = "$built_apk_sha256" || {
            echo "Published APK checksum does not match the built APK."
            exit 1
          }
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          path=Path("patch-results.json")
          data=json.loads(path.read_text())
          kept=[]
          tag="quick-v"+os.environ["VERSION_NAME"]
          for patch in data.get("patches", []):
              base=int(patch["baseVersionCode"])
              filename=f"patch-from-{base}.bin"
              url=f"https://github.com/alhmeemzool-ops/phonek-app/releases/download/{tag}/{filename}"
              try:
                  out=Path(f"published-patch-{base}.bin")
                  subprocess.run(["curl","-fL","--retry","5","--retry-delay","3","--retry-all-errors","-o",str(out),url],check=True)
                  digest=hashlib.sha256(out.read_bytes()).hexdigest()
                  if digest == patch["sha256"]:
                      kept.append(patch)
                  else:
                      print(f"Dropping {filename}: published SHA-256 mismatch")
                      subprocess.run(["gh","release","delete-asset",tag,filename,"--yes"],check=False)
                  out.unlink(missing_ok=True)
              except Exception as exc:
                  print(f"Dropping {filename}: verification failed: {exc}")
                  subprocess.run(["gh","release","delete-asset",tag,filename,"--yes"],check=False)
          data["patches"]=kept
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n")
          PY

      - name: Write Quick update manifest
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          apk_sha256="$(sha256sum build/app/outputs/flutter-apk/app-release.apk | awk '{print $1}')"
          python3 tool/make_patches.py manifest --manifest latest-update.json --result patch-results.json --new-apk build/app/outputs/flutter-apk/app-release.apk --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" --apk-url "https://github.com/alhmeemzool-ops/phonek-app/releases/download/quick-v${VERSION_NAME}/app-release.apk" --apk-sha256 "$apk_sha256" --release-prefix "https://github.com/alhmeemzool-ops/phonek-app/releases/download/quick-v${VERSION_NAME}/" --output update.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Update PhoneK quick update manifest"
          git status --short
          git reset --hard HEAD

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Failed to push update manifest after 3 attempts."
          exit 1
