name: Quick Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: phonek-quick-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Cache Flutter/Dart packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: phonek-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            phonek-pub-${{ runner.os }}-

      - name: Cache Gradle build state
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: phonek-gradle-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            phonek-gradle-${{ runner.os }}-

      - name: Restore Android upload keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode --ignore-garbage > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          chmod 600 android/upload-keystore.jks android/key.properties
          keytool -list -keystore android/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Install dependencies
        run: flutter pub get

      - name: Patch share_plus Android compile SDK
        run: |
          for file in "$PUB_CACHE"/hosted/pub.dev/share_plus-*/android/build.gradle; do
            if [ -f "$file" ]; then
              sed -i 's/compileSdkVersion 33/compileSdkVersion 36/g' "$file"
            fi
          done

      - name: Read app version
        id: version
        shell: bash
        run: |
          version_line=$(grep '^version:' pubspec.yaml)
          version_name=$(echo "$version_line" | sed -E 's/version: ([^+]+)\+.*/\1/')
          version_code=$(echo "$version_line" | sed -E 's/version: [^+]+\+([0-9]+)/\1/')
          test -n "$version_name" && test -n "$version_code"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm,android-arm64 --no-pub --build-name=${{ steps.version.outputs.version_name }} --build-number=${{ steps.version.outputs.version_code }} --dart-define=PHONEK_BUILD_NUMBER=${{ steps.version.outputs.version_code }}

      - name: Verify APK signature
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phonek-quick-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
