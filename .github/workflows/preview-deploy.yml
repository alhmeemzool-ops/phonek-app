name: PhoneK Preview

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: phonek-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test --no-pub

      - name: Build web
        run: flutter build web --release --no-pub

      - name: Deploy preview to Netlify
        uses: netlify/actions/cli@master
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 87a6418c-d38b-45ef-91d8-e0ae340431ca
        with:
          args: deploy --dir=build/web --prod --site=87a6418c-d38b-45ef-91d8-e0ae340431ca
          secrets: '["NETLIFY_AUTH_TOKEN"]'

# Trigger preview deployment after Netlify token setup.
