name: phonek_app
description: "فونك | PhoneK - سوق بيع وشراء الهواتف في السودان"
publish_to: 'none'
version: 1.0.80+80

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  url_launcher: ^6.2.5
  share_plus: ^10.1.4
  image_picker: ^1.0.7
  # Keep image on the archive-3-compatible line required by binary_patch.
  image: ^4.3.0
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.3.4
  provider: ^6.1.2
  supabase_flutter: ^2.15.4
  google_maps_flutter: ^2.12.3
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  http: ^1.1.2
  package_info_plus: ^8.0.2
  crypto: ^3.0.6
  firebase_core: ^4.11.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  binary_patch: ^1.0.0
  model_viewer_plus: ^1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/badges/
    - assets/badges/3d/
